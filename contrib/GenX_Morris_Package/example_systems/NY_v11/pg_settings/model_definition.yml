# MODEL DEFINITION

model_regions:
  - NENG_Rest
  - NY_Z_A
  - NY_Z_B
  - NY_Z_C&E
  - NY_Z_D
  - NY_Z_F
  - NY_Z_G-I
  - NY_Z_J
  - NY_Z_K
  - PJM_EMAC
  - PJM_Rest

region_aggregations:
  PJM_Rest:
    [PJM_COMD, PJM_Dom, PJM_WMAC, PJM_SMAC, PJM_PENE, PJM_West, PJM_AP, PJM_ATSI]
  NENG_Rest:
    [NENG_ME, NENGREST, NENG_CT]

target_usd_year: 2024

model_year: [2030, 2035, 2040, 2050]

model_first_planning_year: [2024, 2031, 2036, 2041]

utc_offset: -5

regional_capacity_reserves:
  CapRes_1:
    NENG_Rest: 0.143
  CapRes_2:
    NY_Z_A: 0.156
    NY_Z_B: 0.156
    NY_Z_C&E: 0.156
    NY_Z_D: 0.156
    NY_Z_F: 0.156
    NY_Z_G-I: 0.156
    NY_Z_J: 0.156
    NY_Z_K: 0.156
  CapRes_3:
    PJM_EMAC: 0.149
    PJM_Rest: 0.149

cap_res_network_derate_default: 0.95

######################################################################################
