# Merged resource_tags.yml (NY + CONUS)
# Criteria:
# 1. NY-only settings included
# 2. Region-specific: NY as baseline, update from CONUS for ISNE, PJM, NY regions (using mapping)
# 3. New non-region-specific CONUS settings included
# 4. For non-region-specific settings in both, use CONUS value if different

model_tag_names: # Union of both files, preserving order, CONUS first if conflict
  - Resource_Type
  - MGA
  - New_Build
  - Can_Retire
  - THERM
  - VRE
  - MUST_RUN
  - STOR
  - FLEX
  - HYDRO
  - LDS
  - Num_VRE_Bins
  - ESR_1
  - ESR_2
  - ESR_3
  - ESR_4
  - ESR_5
  - ESR_6
  - CapRes_1
  - CapRes_2
  - CapRes_3
  - MinCapTag_1 #OSW NY
  - MinCapTag_2 #OSW NJ
  - MinCapTag_3 #OSW PJM
  - MinCapTag_4 #OSW NENG
  - MinCapTag_5 #storage NY
  - MinCapTag_6 #storage NJ
  - MinCapTag_7 #storage PJM
  - MinCapTag_8 #storage NENG
  - Can_Retrofit
  - Retrofit
  - Retrofit_Efficiency
  - Retrofit_Id
  # ...add any additional tags from either file...

default_model_tag: 0

# Merge model_tag_values and other non-region-specific settings
