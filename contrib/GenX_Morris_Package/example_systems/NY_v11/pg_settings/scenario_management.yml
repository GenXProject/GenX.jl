# Merged scenario_management.yml (NY + CONUS)
# Criteria:
# 1. NY-only settings included
# 2. Region-specific: NY as baseline, update from CONUS for ISNE, PJM, NY regions (using mapping)
# 3. New region-specific settings (ISNE, PJM, NY) from CONUS included, mapped
# 4. New non-region-specific CONUS settings included
# 5. For non-region-specific settings in both, use CONUS value if different

settings_management:
  all_years:
    zcf_prices:
      low:
        user_fuel_price:
          hydrogen: 0 #from Princeton's NZA
          waste_biomass: 1 # from ATB 2021
      base:
        user_fuel_price:
          hydrogen: 16 #from Princeton's NZA
          waste_biomass: 1 # from ATB 2021
    coal_price:
      high:
        regional_fuel_adjustments:
          NENG_Rest:
            coal: [add, 0.5]
          NY_Z_A:
            coal: [add, 0.5]
          NY_Z_B:
            coal: [add, 0.5]
          NY_Z_C&E:
            coal: [add, 0.5]
          NY_Z_D:
            coal: [add, 0.5]
          NY_Z_F:
            coal: [add, 0.5]
          NY_Z_G-I:
            coal: [add, 0.5]
          NY_Z_J:
            coal: [add, 0.5]
          NY_Z_K:
            coal: [add, 0.5]
          PJM_EMAC:
            coal: [add, 0.5]
          PJM_Rest:
            coal: [add, 0.5]
    period_years:
      ten:
        model_year: [2030, 2035, 2040, 2050]
        model_first_planning_year: [2024, 2031, 2036, 2041]
    ira:
      yes:
        renewables_clusters:
          - region: all
            technology: landbasedwind
            group:
              - m_primefarmland
            group_modifiers:
              - group: m_primefarmland
                group_value: 1
                Var_OM_Cost_per_MWh: -9.71
              - group: m_primefarmland
                group_value: 0
                Var_OM_Cost_per_MWh: -9.71
            filter:
              - feature: lcoe
                max: 80
            bin:
              - feature: lcoe
                q: 3
                weights: "mw"
            cluster:
              - feature: cf #profile
                n_clusters: 2
                #mw_per_cluster: 5000
                method: agg
          - region: all
            technology: utilitypv
            group:
              - m_primefarmland
            group_modifiers:
              - group: m_primefarmland
                group_value: 1
                Var_OM_Cost_per_MWh: -9.25
              - group: m_primefarmland
                group_value: 0
                Var_OM_Cost_per_MWh: -9.25
            filter:
              - feature: lcoe
                max: 40
            bin:
              - feature: lcoe
                weights: mw
                q: 3
                # bins: [0, 27, 31, 41]
            cluster:
              - feature: cf
                n_clusters: 2
                #mw_per_cluster: 10000
                method: agg
          - region: all
            technology: offshorewind
            turbine_type: fixed
            pref_site: 1
            filter:
              - feature: lcoe
                max: 150
              # - feature: d_shore_m
              #   min: 15
            bin:
              - feature: interconnect_capex_mw
                q: 3
                weights: "mw"
          - region: all
            technology: offshorewind
            turbine_type: floating
            pref_site: 1
            filter:
              - feature: lcoe
                max: 150
              # - feature: d_shore_m
              #   min: 0
            bin:
              - feature: interconnect_capex_mw
                q: 3
                weights: "mw"
          - region: all
            technology: offshorewind
            turbine_type: fixed
            pref_site: 0
            filter:
              - feature: lcoe
                max: 150
              # - feature: d_shore_m
              #   min: 0
            bin:
              - feature: interconnect_capex_mw
                q: 3
                weights: "mw"
          - region: all
            technology: offshorewind
            turbine_type: floating
            pref_site: 0
            filter:
              - feature: lcoe
                max: 150
              # - feature: d_shore_m
              #   min: 15
            bin:
              - feature: interconnect_capex_mw
                q: 3
                weights: "mw"
        atb_modifiers:
          Offwind:
            capex_mw: [mul, 0.63]
          Offwind_floating:
            capex_mw: [mul, 0.63]
          bat:
            capex_mw: [mul, 0.63]
            capex_mwh: [mul, 0.63]
          nuclear:
            capex_mw: [mul, 0.63]

      no: 
        renewables_clusters:
          - region: all
            technology: landbasedwind
            group:
              - m_primefarmland
            group_modifiers:
              - group: m_primefarmland
                group_value: 1
                Var_OM_Cost_per_MWh: 0
              - group: m_primefarmland
                group_value: 0
                Var_OM_Cost_per_MWh: 0
