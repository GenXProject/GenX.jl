            group_modifiers:
              - group: m_primefarmland
                group_value: 1
                Var_OM_Cost_per_MWh: 0
              - group: m_primefarmland
                group_value: 0
                Var_OM_Cost_per_MWh: 0
            filter:
              - feature: lcoe
                max: 40
            bin:
              - feature: lcoe
                weights: mw
                q: 3
                # bins: [0, 27, 31, 41]
            cluster:
              - feature: cf
                n_clusters: 2
                #mw_per_cluster: 10000
                method: agg
          - region: all
            technology: offshorewind
            turbine_type: fixed
            pref_site: 1
            filter:
              - feature: lcoe
                max: 150
              # - feature: d_shore_m
              #   min: 15
            bin:
              - feature: interconnect_capex_mw
                q: 3
                weights: "mw"
          - region: all
            technology: offshorewind
            turbine_type: floating
            pref_site: 1
            filter:
              - feature: lcoe
                max: 150
              # - feature: d_shore_m
              #   min: 0
            bin:
              - feature: interconnect_capex_mw
                q: 3
                weights: "mw"
          - region: all
