                weights: "mw"
          - region: all
            technology: offshorewind
            turbine_type: floating
            pref_site: 0
            filter:
              - feature: lcoe
                max: 150
              # - feature: d_shore_m
              #   min: 15
            bin:
              - feature: interconnect_capex_mw
                q: 3
                weights: "mw"
        atb_modifiers:
          Offwind:
            capex_mw: [mul, 1]
          Offwind_floating:
            capex_mw: [mul, 1]
          bat:
            capex_mw: [mul, 1]
            capex_mwh: [mul, 1]
