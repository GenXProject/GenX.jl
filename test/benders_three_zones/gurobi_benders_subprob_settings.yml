# Gurobi settings for Benders *operational subproblems*.
# Subproblems are LPs whose dual variables form the Benders cuts, so
# crossover must be ON to obtain a vertex (basic feasible) solution with
# well-defined simplex duals. Single-threaded to avoid contention across
# distributed workers.

Method: 2           # Barrier algorithm
BarConvTol: 1.0e-4  # Barrier convergence tolerance
Crossover: 1        # Enable crossover — accurate dual variables are required for cuts
Threads: 1          # Single thread per worker (avoids contention in distributed runs)
