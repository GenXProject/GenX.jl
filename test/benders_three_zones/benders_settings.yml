# Benders decomposition algorithm settings for the three-zones test.
# All keys are optional; values shown here are the GenX defaults.
# An empty file ({}) would also work — these are included for clarity.

BD_ConvTol: 1.0e-3       # Convergence tolerance on relative optimality gap
BD_MaxIter: 300           # Maximum number of Benders iterations
BD_MaxCpuTime: 86400      # Maximum wall-clock time in seconds (24 h)
BD_StabParam: 0.0         # Level-set stabilisation parameter (0 = disabled)
BD_StabDynamic: false     # Dynamic stabilisation (Magnanti–Wong / in-out)
BD_ExpectFeasible: false  # Assume subproblems are always feasible
BD_IntegerInvestment: 0   # Investment variables are continuous (LP relaxation)
