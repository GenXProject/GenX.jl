# HiGHS settings for the Benders *planning* (master) problem — case 7.
#
# The master is a continuous LP (IntegerInvestment: false).
# IPM without crossover solves it efficiently; master LP duals are not used
# for Benders cuts (only subproblem duals are), so crossover is unnecessary.
# Tight tolerances ensure the planning solution passed to subproblems is
# accurate, avoiding errors in the fixed first-stage variable values.

Feasib_Tol: 1.0e-9          # Primal feasibility tolerance
Optimal_Tol: 1.0e-9         # Dual feasibility tolerance
Pre_Solve: "on"              # Presolve improves conditioning before IPM
Method: ipm                  # IPM for the master LP
ipm_optimality_tolerance: 1.0e-9  # IPM convergence tolerance
run_crossover: "off"         # No crossover needed — master LP duals unused
mip_rel_gap: 1.0e-4          # MIP gap (only if IntegerInvestment: true)
output_flag: false
threads: 1
