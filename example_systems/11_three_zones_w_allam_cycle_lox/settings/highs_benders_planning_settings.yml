# HiGHS settings for the Benders *planning* (master) problem.
#
# The master problem is a continuous LP when IntegerInvestment: false (the
# default).  The IPM algorithm without crossover solves the LP quickly and
# still provides the accurate primal solution needed to fix investment
# variables in the subproblems.  If IntegerInvestment: true is set the master
# becomes a MILP; the mip_rel_gap entry below controls that tolerance.

Feasib_Tol: 1.0e-6          # Primal feasibility tolerance
Optimal_Tol: 1.0e-6         # Dual feasibility tolerance
Method: ipm                  # Algorithm: ipm = interior-point (barrier)
ipm_optimality_tolerance: 1.0e-6  # IPM convergence tolerance
run_crossover: "off"         # Disable crossover — barrier solution is sufficient
                             # for the master (LP duals are not used here)
mip_rel_gap: 1.0e-3          # MIP relative optimality gap (only relevant when
                             # IntegerInvestment: true)
